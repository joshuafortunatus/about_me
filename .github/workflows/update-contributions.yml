name: Update GitHub contributions snapshot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions
        run: python3 scripts/update_contributions.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/gh-contributions.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gh-contributions.json
          git commit -m "Update GitHub contributions snapshot"
          git push
